services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: talentiq-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: talentiq
      POSTGRES_USER: talentiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5437:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentiq -d talentiq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: